#
# One runner-label declaration, which is a declaration and not an ignore. actionlint validates
# `runs-on:` against GitHub's own hosted labels, so the fleet convention `depot-ubuntu-24.04-8` —
# Depot's 8-core/32 GB Ubuntu 24.04 runner, used by the heavy compile jobs — reads to it as a typo.
# Listing the label here is what tells it the difference: a real typo (`depot-ubuntu-24.4-8`) is
# still a hard error, because nothing outside this list is accepted.
#
# If a suppression is ever added here it needs its own paragraph — an unexplained ignore is how a
# scanner stops meaning anything. (A previous `$/` self-repository suppression lived here until the
# Depot runner agent turned out to predate that syntax; see the comment at the composite-action use
# site in ci.yml.)
self-hosted-runner:
  labels:
    - depot-ubuntu-24.04-8
