#
# The whole fleet: all 258 groups compiled, packed to Go, and measured against x/mod/zip's
# per-module source cap.
#
# THIS WORKFLOW HAS NEVER EXECUTED. It was authored in M3 stage 2 and the repository has no pushed
# remote branches, so neither the cron nor the label trigger has ever fired. Every step below is a
# transcription of a command run by hand locally; the first real run is also this file's first test.
#
# This is separate from ci.yml because it is the expensive half. Packing the fleet is ~880 CPU
# seconds and ~540 MiB of output; ci.yml compiles all 258 on every PR (cheap, ~320 CPU seconds) but
# packs and measures only two of the eight shards, on the argument that the size bound has 8.6x of
# headroom on its worst module and does not move without the schema moving. This workflow closes
# that gap on a schedule, on demand, and on a label — so a PR that really does change the shape of
# the output can ask for the full run before it merges.
name: fleet-full

on:
  schedule:
    # 04:20 UTC daily — after nothing in particular, just off the hour so it is not competing with
    # every other cron on the runners.
    - cron: "20 4 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: fleet-full-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; every job below declares exactly the permissions it needs. Nothing in
# either workflow writes to the repository, so every job is `contents: read` — but declared per job,
# so adding one that does need more is a visible edit rather than an inherited grant.
permissions: {}

jobs:
  fleet:
    # On a pull request this runs only when the `full-fleet` label is on it. `synchronize` is in the
    # trigger list so a labelled PR keeps re-running as it is pushed to, rather than proving the
    # fleet once against a revision that then changes.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-fleet')
    name: pacmak + size shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache-dependency-path: tools/gosize/go.sum
      - run: pnpm install --frozen-lockfile

      - name: jsii + jsii-pacmak --targets go, shard ${{ matrix.shard }} of 8
        run: node scripts/build-fleet.mjs --shard ${{ matrix.shard }}/8

      - name: JSII3 and JSII6 must be zero
        run: |
          node -e '
            const r = require("./tmp/m3/fleet-jsii.json");
            const j3 = r.codeTotals.JSII3 ?? 0;
            const j6 = r.codeTotals.JSII6 ?? 0;
            console.log(`${r.okCount}/${r.groups} OK, JSII3 ${j3}, JSII6 ${j6}`);
            if (r.okCount !== r.groups || j3 !== 0 || j6 !== 0) process.exit(1);
          '

      - name: no cross-group imports in the packed Go
        run: node scripts/check-go-module-isolation.mjs

      - name: zip.CheckDir size gate
        run: node scripts/check-go-size.mjs --json tmp/m3/sizes-shard-${{ matrix.shard }}.json

      - name: upload the size records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fleet-full-shard-${{ matrix.shard }}
          path: tmp/m3/
          if-no-files-found: ignore

  # The shards each measure their own eighth; only together do they answer "does every one of the
  # 258 modules fit, and which is worst". This job says so in one place.
  summary:
    name: whole-fleet size summary
    needs: fleet
    if: always() && needs.fleet.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fleet-full-shard-*
          path: shards
          merge-multiple: true
      - name: every module under the cap, and the worst one named
        run: |
          node -e '
            const fs = require("node:fs");
            const files = fs.readdirSync("shards").filter((f) => /^sizes-shard-\d+\.json$/.test(f));
            if (files.length !== 8) {
              throw new Error(`expected 8 shard records, got ${files.length}: ${files.join(", ")}`);
            }
            const shards = files.map((f) => JSON.parse(fs.readFileSync(`shards/${f}`, "utf-8")));
            const cap = shards[0].cap;
            const records = shards.flatMap((s) => s.records);
            // The count is the point: a shard that silently measured nothing would otherwise leave
            // "0 over the cap" looking exactly like a pass.
            if (records.length !== 258) {
              throw new Error(`measured ${records.length} modules, expected 258`);
            }
            records.sort((a, b) => b.totalValidBytes - a.totalValidBytes);
            for (const r of records.slice(0, 5)) {
              const pct = ((100 * r.totalValidBytes) / cap).toFixed(2);
              console.log(`${r.module} ${r.totalValidBytes} B = ${pct} % of cap`);
            }
            const over = records.filter((r) => !r.pass);
            const total = records.reduce((a, r) => a + r.totalValidBytes, 0);
            console.log(`258 modules, ${total} B total, ${over.length} over the ${cap} B cap`);
            for (const r of over) console.error(`OVER CAP ${r.module} ${r.totalValidBytes} B`);
            if (over.length > 0) process.exit(1);
          '
